<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="header">
  <h1>{{full_name}}</h1>
  <div class="contact">
    {{email}} | {{phone}} | {{location}} | {{linkedin}}
  </div>
</div>

<div class="divider"></div>

<div class="date">
  {{date}}
</div>

<div class="recipient">
  <strong>{{recipient_name}}</strong><br/>
  {{company_name}}<br/>
  {{company_address}}
</div>

<div class="salutation">
  Dear {{recipient_name}},
</div>

<div class="content">
  {{body_paragraphs}}
</div>

<div class="closing">
  Best regards,<br/><br/>
  {{full_name}}
</div>

</body>
</html>
